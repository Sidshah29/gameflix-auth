name: GameFlix CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      # Automated test step: unit + integration tests run against in-memory H2
      # (the 'test' profile), so no MySQL service is needed in CI.
      - name: Build and run tests
        run: mvn -B clean package

      # Security scan step: Trivy scans the source tree and dependencies for
      # known CVEs. Reported for visibility; flip exit-code to '1' to make a
      # HIGH/CRITICAL finding fail the pipeline.
      - name: Security scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '0'

      - name: Build Docker image
        run: docker build -t gameflix-backend .
