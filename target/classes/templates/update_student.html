<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-wEmeIV1mKuiNpC+IOBjI7aAzPcEZeedi5yW5f2yOq55WWLwNGmvvx4Um1vskeMj0"
          crossorigin="anonymous">
</head>
<body>
<div class="container mt-4">
    <h1>Student Management System</h1>
    <hr>
    <h2>Update Student</h2>

    <form th:action="@{/students/save}" th:object="${student}" method="post">
        <input type="hidden" th:field="*{sid}"/>

        <input type="text" th:field="*{studName}" class="form-control mb-3 col-4">

        <input type="text" th:field="*{studEmail}" class="form-control mb-3 col-4">

        <button type="submit" class="btn btn-info col-2">Update Student</button>
        <a th:href="@{/students}" class="btn btn-secondary ms-2">Back to Student List</a>
    </form>

    <hr>
    <p>
        Course enrollment is managed separately.
        <a th:href="@{/students/{id}/courses(id=${student.sid})}" class="btn btn-primary btn-sm">Manage Courses for this Student</a>
    </p>

    <a th:href="@{/}" class="btn btn-secondary">Back to Home</a>
</div>
</body>
</html>
