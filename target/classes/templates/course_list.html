<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Courses List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css"
          rel="stylesheet" crossorigin="anonymous">
</head>
<body>
<div class="container mt-4">
    <h1>Courses List</h1>
    <a class="btn btn-primary mb-3" th:href="@{/courses/new}">Add Course</a>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>Department</th>
            <th>Number</th>
            <th>Name</th>
            <th>Students</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="course : ${courses}">
            <td th:text="${course.courseDept}">IST</td>
            <td th:text="${course.courseNum}">420</td>
            <td th:text="${course.courseName}">Systems Integration Intro</td>
            <td th:text="${course.courseStuds}">20</td>
            <td>
                <a class="btn btn-sm btn-primary"
                   th:href="@{/courses/update/{id}(id=${course.id})}">Update</a>
                <a class="btn btn-sm btn-danger ms-1"
                   th:href="@{/courses/delete/{id}(id=${course.id})}">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>

    <a class="btn btn-secondary" th:href="@{/}">Back Home</a>
</div>
</body>
</html>
