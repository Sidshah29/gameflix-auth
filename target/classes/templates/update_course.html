<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Course Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-wEmeIV1mKuiNpC+IOBjI7aAzPcEZeedi5yW5f2yOq55WWLwNGmvvx4Um1vskeMj0"
          crossorigin="anonymous">
</head>
<body>
<div class="container mt-4">
    <h1>Course Management System</h1>
    <hr>
    <h2>Update Course</h2>

    <form th:action="@{/courses/save}" th:object="${course}" method="post">
        <input type="hidden" th:field="*{id}"/>

        <input type="text" th:field="*{courseDept}" class="form-control mb-3 col-4">

        <input type="text" th:field="*{courseNum}" class="form-control mb-3 col-4">

        <input type="text" th:field="*{courseName}" class="form-control mb-3 col-4">

        <input type="text" th:field="*{courseStuds}" class="form-control mb-3 col-4">

        <button type="submit" class="btn btn-info col-2">Update Course</button>
        <a th:href="@{/courses}" class="btn btn-secondary ms-2">Back to Course List</a>
    </form>
</div>
</body>
</html>
