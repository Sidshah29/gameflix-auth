<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-wEmeIV1mKuiNpC+IOBjI7aAzPcEZeedi5yW5f2yOq55WWLwNGmvvx4Um1vskeMj0"
          crossorigin="anonymous">
</head>
<body>
<div class="container mt-4">
    <h1>Students</h1>

    <table class="table table-striped table-responsive-md">
        <thead>
        <tr>
            <th>Student Name</th>
            <th>Student Email</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="student : ${listStudents}">
            <td th:text="${student.studName}">Name</td>
            <td th:text="${student.studEmail}">Email</td>
            <td>
                <a th:href="@{/students/update/{id}(id=${student.sid})}"
                   class="btn btn-primary me-2">Update</a>
                <a th:href="@{/students/{id}/courses(id=${student.sid})}"
                   class="btn btn-info me-2">Manage Courses</a>
                <a th:href="@{/students/delete/{id}(id=${student.sid})}"
                   class="btn btn-danger">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>

    <a th:href="@{/}" class="btn btn-secondary">Back to Course List</a>
    <a th:href="@{/students/new}" class="btn btn-primary ms-2">Add Student</a>
</div>
</body>
</html>
