<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head">
    <title>GameFlix</title>
</head>
<body>
<div th:replace="fragments :: navbar"></div>

<div class="container">
    <h1 class="mt-2">Welcome to GameFlix</h1>
    <p class="lead">Your subscription-based game streaming library. Browse the catalog, pick a
        plan, and manage everything from one place.</p>

    <div class="row mt-4">
        <div class="col-md-4 mb-3">
            <div class="card text-bg-dark h-100">
                <div class="card-body">
                    <h5 class="card-title">Games available</h5>
                    <p class="display-6 mb-0" th:text="${catalogSize}">5</p>
                </div>
            </div>
        </div>
        <div class="col-md-4 mb-3">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title">Current plan</h5>
                    <p class="display-6 mb-0" th:text="${currentPlan}">STANDARD</p>
                    <small class="text-muted">for user
                        <span th:text="${demoUser}">demo</span></small>
                </div>
            </div>
        </div>
        <div class="col-md-4 mb-3">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title">Quick actions</h5>
                    <a class="btn btn-danger w-100 mb-2" th:href="@{/catalog}">Browse Catalog</a>
                    <a class="btn btn-outline-dark w-100" th:href="@{/subscription}">Manage Subscription</a>
                </div>
            </div>
        </div>
    </div>

    <hr>
    <p class="text-muted">Admin? Manage the game library on the
        <a th:href="@{/admin}">Admin</a> page.</p>
</div>
</body>
</html>
