<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${title}">Student Courses</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css"
          integrity="sha384-wEmeIV1mKuiNpC+IOBjI7aAzPcEZeedi5yW5f2yOq55WWLwNGmvvx4Um1vskeMj0"
          crossorigin="anonymous"/>
</head>
<body>
<div class="container mt-4">
    <div class="page-header">
        <h3 th:text="${title}">Student Courses</h3>
    </div>

    <form th:action="@{/students/{sid}/courses/add(sid=${student.sid})}" method="post">
        <select class="form-control" name="courseId">
            <option th:each="course : ${courses}"
                    th:value="${course.id}"
                    th:text="${course.courseName}">
            </option>
        </select>

        <button type="submit" class="btn btn-primary">Add Course</button>
        <a th:href="@{/students}" class="btn btn-secondary ms-2">Back to Student List</a>
    </form>
</div>
</body>
</html>
