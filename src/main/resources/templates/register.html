<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head">
    <title>Register</title>
</head>
<body>
<div th:replace="fragments :: navbar"></div>

<div class="container" style="max-width: 520px;">
    <h1 class="mb-3">Create an account</h1>
    <p class="text-muted">Posts to <code>POST /register</code>. Passwords are stored as a
        BCrypt hash, never in plaintext.</p>

    <div class="mb-3">
        <label class="form-label">Username</label>
        <input class="form-control" id="username" placeholder="at least 3 characters">
    </div>
    <div class="mb-3">
        <label class="form-label">Email</label>
        <input class="form-control" id="email" type="email" placeholder="you@example.com">
    </div>
    <div class="mb-3">
        <label class="form-label">Password</label>
        <input class="form-control" id="password" type="password" placeholder="at least 6 characters">
    </div>
    <button class="btn btn-danger" onclick="doRegister()">Register</button>
    <a class="btn btn-outline-secondary" th:href="@{/login}">Already have one?</a>

    <div class="mt-4" id="result" style="display:none;">
        <label class="form-label fw-bold">Server response</label>
        <pre class="bg-dark text-light p-3 rounded" id="output"></pre>
    </div>
</div>

<script>
    async function doRegister() {
        const body = {
            username: document.getElementById('username').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
        };
        const res = await fetch('/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        const data = await res.json();
        document.getElementById('result').style.display = 'block';
        document.getElementById('output').textContent =
            'HTTP ' + res.status + '\n' + JSON.stringify(data, null, 2);
    }
</script>
</body>
</html>
