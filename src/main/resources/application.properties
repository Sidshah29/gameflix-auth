spring.application.name=gameflix-auth
server.port=8080

# DATASOURCE CONFIGURATION
# Defaults point at a local MySQL Workbench schema (gameflix_db). Every value can
# be overridden with an environment variable so no real secret has to live in git
# for a deployment. Local dev works with the defaults and no extra setup.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/gameflix_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Sidshag@29}

# JPA / HIBERNATE PROPERTIES
# Hibernate 6 (Spring Boot 3) auto-detects the MySQL dialect - do not set spring.jpa.properties.hibernate.dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# JWT (override gameflix.jwt.secret via the JWT_SECRET env var in any real deployment)
gameflix.jwt.secret=${JWT_SECRET:dev-only-change-me-please-32-bytes-minimum!!}
gameflix.jwt.expiry-minutes=${JWT_EXPIRY_MINUTES:60}

# LOGGING
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.results=TRACE
