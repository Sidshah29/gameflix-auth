spring.application.name=gameflix-auth
server.port=8080

# DATASOURCE CONFIGURATION
# Update the schema name (gameflix_db), username, and password to match your local MySQL Workbench setup.
spring.datasource.url=jdbc:mysql://localhost:3306/gameflix_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Sidshag@29

# JPA / HIBERNATE PROPERTIES
# Hibernate 6 (Spring Boot 3) auto-detects the MySQL dialect - do not set spring.jpa.properties.hibernate.dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# LOGGING
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.results=TRACE