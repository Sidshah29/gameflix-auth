# Cloud profile: activate with SPRING_PROFILES_ACTIVE=cloud
# Uses an in-memory H2 database so the deployed container needs no external DB.
# Data (games, demo user, subscription) is re-seeded on each start by GameDataLoader.
spring.datasource.url=jdbc:h2:mem:gameflix;DB_CLOSE_DELAY=-1;MODE=LEGACY
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
