# Test profile: in-memory H2 so JUnit runs in CI with no external MySQL.
spring.datasource.url=jdbc:h2:mem:gameflix_test;DB_CLOSE_DELAY=-1;MODE=LEGACY
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
gameflix.jwt.secret=test-secret-key-that-is-at-least-32-bytes-long!!
